name: Build and Push Docker Image

on:
  push:
    branches: [main, ci/docker-native-arm64]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.repository || format('{0}-ci', github.repository) }}

jobs:
  build-and-push:
    name: Build and test ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Normalize image name
        shell: bash
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          echo "IMAGE=${image,,}" >> "$GITHUB_ENV"

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=${{ startsWith(github.ref, 'refs/tags/v') && 'auto' || 'false' }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
            type=raw,value=native-${{ github.run_id }}-${{ github.run_attempt }},enable=${{ github.ref == 'refs/heads/ci/docker-native-arm64' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push native image by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-native-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-native-${{ matrix.arch }}

      - name: Build native PR image locally
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: leapconnect:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-native-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-native-${{ matrix.arch }}

      - name: Smoke-test native image
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          image=leapconnect:smoke
          if [[ "$EVENT_NAME" != pull_request ]]; then
            image="${IMAGE}@${DIGEST}"
            docker pull --platform "$PLATFORM" "$image"
          fi
          bash .github/scripts/smoke-test-image.sh "$image" "$PLATFORM"

      - name: Export tested digest
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload tested digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge tested native images
    if: github.event_name != 'pull_request'
    needs: build-and-push
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Normalize image name
        shell: bash
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          echo "IMAGE=${image,,}" >> "$GITHUB_ENV"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=${{ startsWith(github.ref, 'refs/tags/v') && 'auto' || 'false' }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
            type=raw,value=native-${{ github.run_id }}-${{ github.run_attempt }},enable=${{ github.ref == 'refs/heads/ci/docker-native-arm64' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download tested digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create and verify multi-platform manifest
        shell: bash
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA_JSON")
          [[ ${#tags[@]} -gt 0 ]]
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done
          digests=("$RUNNER_TEMP"/digests/*)
          [[ ${#digests[@]} -eq 2 ]]
          sources=()
          for digest_file in "${digests[@]}"; do
            digest="${digest_file##*/}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[0]}" --raw | jq -e '
            [.manifests[].platform
             | select(.os != "unknown" and .architecture != "unknown")
             | "\(.os)/\(.architecture)"]
            | sort | unique == ["linux/amd64", "linux/arm64"]
          '
